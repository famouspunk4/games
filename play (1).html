<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    #main-content {
      width: 100% !important;
      max-width: none !important;
    }

    /* Fixed overlay container */
    .game-wrapper {
      position: fixed;
      top: 0px;
      left: 0;
      right: 0;
      bottom: 0px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 50px;
      z-index: 10;
      pointer-events: none; /* Passes clicks through background space to navigation */
    }

    /* Game Frame Container */
    .game-frame-container {
      pointer-events: auto; /* Re-enables clicks/focus specifically for the game frame */
      aspect-ratio: 4 / 3;
      height: 80vh;
      max-height: 85vh;
      background-color: #000000;
      border: 1px dashed #000000;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Login Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }
  </style>
</head>
<body>

  <!-- Layout Shell Container -->
  <div id="layout-container"></div>

  <!-- Game Content Template -->
  <template id="game-content">
    <div class="game-wrapper">
      <div class="game-frame-container">
        <iframe id="game-iframe" src="" class="game-frame" allowfullscreen></iframe>
      </div>
    </div>
  </template>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameParam = urlParams.get('game') || 'zonbikillaz.html';

    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;
        
        const content = document.getElementById('game-content').content.cloneNode(true);
        document.body.appendChild(content);

        const iframe = document.getElementById('game-iframe');
        if (iframe) {
          iframe.src = `games/${gameParam}`;
          iframe.onload = () => {
            iframe.contentWindow.focus();
          };
        }

        initModalEvents();
      })
      .catch(err => console.error('Error loading layout:', err));

    function initModalEvents() {
      const accountIconBtn = document.getElementById('account-icon-btn');
      const loginModal = document.getElementById('login-modal');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSubmit = document.getElementById('modal-submit');
      const modalPasscode = document.getElementById('modal-passcode');

      if (accountIconBtn) {
        accountIconBtn.addEventListener('click', (e) => {
          e.preventDefault();
          loginModal.style.display = 'flex';
          modalPasscode.focus();
        });
      }

      if (modalCancel) {
        modalCancel.addEventListener('click', () => {
          loginModal.style.display = 'none';
          modalPasscode.value = '';
        });
      }

      if (modalSubmit) modalSubmit.addEventListener('click', handleLogin);
      if (modalPasscode) {
        modalPasscode.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleLogin();
        });
      }

      function handleLogin() {
        if (modalPasscode.value.trim() !== '') {
          loginModal.style.display = 'none';
          window.location.href = 'create.html';
        } else {
          alert('Please enter a passcode.');
        }
      }
    }
  </script>
</body>
</html>
